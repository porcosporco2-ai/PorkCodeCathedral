name: Build Pork Cathedral APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Cathedral
        run: unzip -q PorkCodeCathedral_BUILD003.zip -d extracted
      - name: Build APK
        run: gradle -p extracted/PorkCodeCathedral :app:assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PorkCodeCathedral-APK
          path: extracted/PorkCodeCathedral/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
